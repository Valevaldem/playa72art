<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Panel · PLAYA.72ART</title>
<style>
:root{--bg:#0c0709;--panel:#150f12;--line:#2c2025;--cream:#f0e9dd;--muted:#9c8a92;--pink:#ff2d8b;--yellow:#ffce1f;--green:#1faa4b;--red:#d11a5e}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Arial,sans-serif}
body{background:var(--bg);color:var(--cream);min-height:100vh}
a{color:var(--yellow)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;max-width:380px;width:100%}
.loginbox h1{font-size:22px;margin-bottom:6px}
.loginbox p{color:var(--muted);font-size:13px;margin-bottom:18px}
input,textarea,select{width:100%;background:#0c0709;border:1px solid var(--line);color:var(--cream);border-radius:9px;padding:11px 12px;font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pink)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.btn{background:var(--yellow);color:#1a0a1f;border:none;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.05)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--cream)}
.btn.danger{background:none;border:1px solid #5a2230;color:#ff7a9c}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.err{color:#ff7a9c;font-size:13px;margin-top:10px;min-height:16px}

.top{position:sticky;top:0;z-index:10;background:rgba(21,15,18,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;backdrop-filter:blur(4px)}
.top .ttl{font-weight:800;letter-spacing:1px}
.top .ttl span{color:var(--pink)}
.toprt{display:flex;gap:10px;align-items:center}
.wrap{max-width:880px;margin:0 auto;padding:18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:8px 15px;cursor:pointer;font-size:13px;font-weight:600}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:4px} .card .hint{color:var(--muted);font-size:12px;margin-bottom:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.itemhead b{font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.thumb{position:relative;width:74px;height:74px;border-radius:8px;border:1px solid var(--line);background-size:cover;background-position:center;overflow:hidden}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:#000a;color:#fff;cursor:pointer;font-size:13px;line-height:1}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors input[type=color]{width:46px;height:40px;padding:2px;border-radius:8px}
.swatch{height:26px;border-radius:7px;margin-top:8px;border:1px solid var(--line)}
.savebar{position:sticky;bottom:0;z-index:10;background:rgba(21,15,18,.96);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:flex-end;backdrop-filter:blur(4px)}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#000;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.toast.ok{border-color:var(--green)} .toast.bad{border-color:var(--red)}
.muted{color:var(--muted);font-size:12px}
.pitem{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden;background:var(--panel)}
.pitem.open{border-color:var(--pink)}
.phead{display:flex;align-items:center;gap:10px;padding:9px 10px}
.phead .pth{width:46px;height:46px;border-radius:8px;background-size:cover;background-position:center;flex:none;border:1px solid var(--line)}
.phead .pin{flex:1;min-width:0}
.phead .pin b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .pin span{font-size:12px;color:var(--muted)}
.tagmini{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:20px;white-space:nowrap}
.tagmini.disponible{background:#3a2f0a;color:var(--yellow)} .tagmini.vendido{background:#3a0f22;color:var(--pink)} .tagmini.reservado{background:#3a230a;color:#ffa64d}
.pbody{padding:6px 12px 14px;border-top:1px solid var(--line)}
.pbody.collapsed{display:none}
.catgroup{margin-bottom:18px}
.catgrouphead h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--pink);margin:8px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.catgrouphead .cnt{color:var(--muted);font-size:12px}
.addincat{width:100%;margin-top:2px}
.more-det{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}
.more-det summary{cursor:pointer;font-size:13px;color:var(--yellow);font-weight:600;list-style:none;padding:7px 0}
.more-det summary::-webkit-details-marker{display:none}
.more-det summary:before{content:"▸ "}
.more-det[open] summary:before{content:"▾ "}
.qsave{width:100%;margin-top:12px}
.note{background:#1a1115;border-left:3px solid var(--yellow);border-radius:8px;padding:11px 13px;font-size:13px;color:#cdbcc4;line-height:1.55;margin-bottom:14px}
.note b{color:var(--cream)}
.hidden{display:none!important}
@media(max-width:620px){.two,.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="center" id="loginView">
  <div class="loginbox">
    <h1>Panel <span style="color:var(--pink)">PLAYA.72ART</span></h1>
    <p>Escribe la contraseña para editar la página.</p>
    <div class="field"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn" style="width:100%">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- EDITOR -->
<div id="editorView" class="hidden">
  <div class="top">
    <div class="ttl">PLAYA<span>.72</span>ART · Panel</div>
    <div class="toprt">
      <a id="verSitio" href="index.html" target="_blank" class="btn ghost sm">Ver sitio</a>
      <button class="btn ghost sm" id="logoutBtn">Salir</button>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </div>
  <div class="savebar">
    <span class="muted" id="saveHint"></span>
    <button class="btn" id="saveBtn">Guardar cambios</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== PON AQUÍ TUS DATOS DE SUPABASE (los mismos que en index.html) ====== */
const SUPABASE_URL  = "https://zaczuodbvwzjmzzlneke.supabase.co";
const SUPABASE_ANON = "sb_publishable_5cOpuS3TGF_1SqavUA3-FA_aL9SZdJ9";
const ADMIN_EMAIL   = "panel@playa72.art";                 // <-- correo fijo del panel (crea este usuario en Supabase)

/* ====== CONTENIDO POR DEFECTO (se usa si la base está vacía) ====== */
const DEF = {
  textos:{
    hero_kick:{es:"Street art · Hecho a mano",en:"Street art · Handmade"},
    hero_tag:{es:"Dark pop cartoon",en:"Dark pop cartoon"},
    hero_slogan:{es:"Cada pieza es única e irrepetible.",en:"Every piece is one of a kind."},
    arte_sub:{es:"Piezas únicas e irrepetibles. Si te gusta alguna, apártala por WhatsApp o correo.",en:"One-of-a-kind pieces. If you like one, reserve it via WhatsApp or email."},
    sobre_body:{es:"Nacido en Guadalupe, N.L. Actualmente viviendo en Monterrey. 10 años siendo tatuador…",en:"Born in Guadalupe, N.L. Currently living in Monterrey. 10 years as a tattoo artist…"},
    arteinfo_body:{es:'Estilo único caricaturesco. "Dark pop cartoon".',en:'A unique cartoon style. "Dark pop cartoon".'},
    calle_sub:{es:"Manda tu foto con tu pieza aquí. ¡Muchas gracias por la confianza!",en:"Send your photo with your piece here. Thank you for the trust!"},
    bts_sub:{es:"Piezas en proceso y videos cortos del taller. ¿Te gusta una? Apártala desde ahora.",en:"Works in progress and short studio clips. Like one? Reserve it now."}
  },
  piezas:[
    {id:1,cat:"cuadros",titulo:{es:"Máscara roja",en:"Red mask"},precio:4500,medida:"50×70 cm",estado:"disponible",tecnica:{es:"Acrílico y POSCA sobre tela",en:"Acrylic & POSCA on canvas"},imgs:[]},
    {id:2,cat:"cuadros",titulo:{es:"Sin amor",en:"No love"},precio:6200,medida:"40×40 cm",estado:"vendido",tecnica:{es:"Acrílico sobre tela",en:"Acrylic on canvas"},imgs:[]},
    {id:3,cat:"stickers",titulo:{es:"Pack RIP",en:"RIP pack"},precio:250,medida:"10 stickers",estado:"disponible",tecnica:{es:"Vinil troquelado",en:"Die-cut vinyl"},imgs:[]}
  ],
  calle:[
    {img:"",caption:"@cliente · Máscara roja"},
    {img:"",caption:"@cliente"}
  ],
  proceso:[
    {titulo:{es:"Cuadro en proceso",en:"Canvas in progress"},img:"",video:""}
  ],
  fondo:{grad_colors:["#3a0d47","#8f1450","#d11a5e","#e84a1c","#f0b41a"],fence_on:true,body_bg:"#0c0709",wall_mode:"letras"},
  cats:[
    {key:"cuadros",       label:{es:"Cuadros",       en:"Paintings"}},
    {key:"stickers",      label:{es:"Stickers",      en:"Stickers"}},
    {key:"intervenciones",label:{es:"Intervenciones",en:"Interventions"}}
  ]
};

const TLABEL = {
  hero_kick:"Hero · frase amarilla", hero_tag:"Hero · título grande", hero_slogan:"Hero · texto blanco",
  arte_sub:"Galería · descripción", sobre_body:"Sobre mí · texto", arteinfo_body:"Sobre mi arte · texto",
  calle_sub:"On the streets · descripción", bts_sub:"Behind the scenes · descripción"
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let STATE = null, TAB = "textos";
let openPiezas = new Set();   // qué piezas están desplegadas para editar
const $ = s => document.querySelector(s);
const elFrom = h => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; };
function toast(msg,type){ const t=$("#toast"); t.textContent=msg; t.className="toast show "+(type||""); setTimeout(()=>t.className="toast",2200); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function mergeDefaults(d){
  d = d&&typeof d==="object"?d:{};
  return {
    textos: Object.assign(clone(DEF.textos), d.textos||{}),
    piezas: Array.isArray(d.piezas)&&d.piezas.length? d.piezas : clone(DEF.piezas),
    calle:  Array.isArray(d.calle)? d.calle : clone(DEF.calle),
    proceso:Array.isArray(d.proceso)? d.proceso : clone(DEF.proceso),
    fondo:  Object.assign(clone(DEF.fondo), d.fondo||{}),
    cats:   Array.isArray(d.cats)&&d.cats.length? d.cats : clone(DEF.cats)
  };
}

/* ---------- AUTH ---------- */
async function tryRestore(){
  if(badConfig()){ $("#loginErr").textContent="Falta poner SUPABASE_URL / ANON KEY en el código."; return; }
  const { data } = await sb.auth.getSession();
  if(data && data.session){ await enterEditor(); }
}
function badConfig(){ return !SUPABASE_URL || SUPABASE_URL.indexOf("TU-PROYECTO")>=0 || !SUPABASE_ANON || SUPABASE_ANON.indexOf("TU_ANON")>=0; }
async function login(){
  if(badConfig()){ $("#loginErr").textContent="Falta configurar Supabase en el código."; return; }
  const pw = $("#pw").value.trim(); if(!pw) return;
  $("#loginBtn").disabled=true; $("#loginErr").textContent="";
  const { error } = await sb.auth.signInWithPassword({email:ADMIN_EMAIL, password:pw});
  $("#loginBtn").disabled=false;
  if(error){ $("#loginErr").textContent="Contraseña incorrecta."; return; }
  await enterEditor();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }
async function enterEditor(){
  $("#loginView").classList.add("hidden");
  $("#editorView").classList.remove("hidden");
  const { data, error } = await sb.from("site").select("data").eq("id",1).maybeSingle();
  STATE = mergeDefaults(error? null : (data&&data.data));
  renderTabs(); renderPanel(); $("#saveHint").textContent="No olvides Guardar al terminar";
}

/* ---------- STORAGE UPLOAD ---------- */
async function uploadFile(file){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase();
  const path=Date.now()+"_"+Math.random().toString(36).slice(2,7)+"."+ext;
  const { error }=await sb.storage.from("media").upload(path,file,{cacheControl:"3600",upsert:false});
  if(error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}

/* ---------- TABS ---------- */
const TABS=[["textos","Textos"],["cats","Tipos de arte"],["piezas","Galería"],["calle","On the streets"],["proceso","Behind the scenes"],["fondo","Fondos"]];
function renderTabs(){
  const t=$("#tabs"); t.innerHTML="";
  TABS.forEach(([k,lbl])=>{
    const b=elFrom(`<button class="tab ${k===TAB?'on':''}">${lbl}</button>`);
    b.onclick=()=>{ TAB=k; renderTabs(); renderPanel(); };
    t.appendChild(b);
  });
}
function renderPanel(){
  const p=$("#panel"); p.innerHTML="";
  if(TAB==="textos") renderTextos(p);
  if(TAB==="cats") renderCats(p);
  if(TAB==="piezas") renderPiezas(p);
  if(TAB==="calle") renderCalle(p);
  if(TAB==="proceso") renderProceso(p);
  if(TAB==="fondo") renderFondo(p);
}

/* ---------- TEXTOS ---------- */
function renderTextos(p){
  p.appendChild(elFrom(`<div class="note">✍️ Cada texto tiene <b>Español</b> e <b>Inglés</b>. Si dejas el inglés en blanco, al <b>Guardar</b> se copia solo el español.</div>`));
  Object.keys(DEF.textos).forEach(k=>{
    if(!STATE.textos[k]) STATE.textos[k]={es:"",en:""};
    const c=elFrom(`<div class="card"><h3>${TLABEL[k]||k}</h3><div class="two">
      <div class="field"><label>Español</label><textarea data-k="${k}" data-l="es"></textarea></div>
      <div class="field"><label>English</label><textarea data-k="${k}" data-l="en"></textarea></div></div></div>`);
    c.querySelector('[data-l="es"]').value=STATE.textos[k].es||"";
    c.querySelector('[data-l="en"]').value=STATE.textos[k].en||"";
    c.querySelectorAll("textarea").forEach(ta=>ta.oninput=e=>{STATE.textos[k][e.target.dataset.l]=e.target.value;});
    p.appendChild(c);
  });
}

/* ---------- TIPOS DE ARTE (categorías) ---------- */
function renderCats(p){
  p.appendChild(elFrom(`<p class="muted" style="margin-bottom:10px">Tipos de arte que aparecen en el menú de “Arte”, en los filtros y al asignar cada pieza. El orden de aquí es el orden del menú.</p>`));
  p.appendChild(elFrom(`<div class="note">ℹ️ <b>Renombrar</b> un tipo es seguro: las piezas que ya lo usan se quedan conectadas, solo cambia el nombre que se ve en la página.<br><b>Eliminar</b> un tipo no borra sus piezas — pasan a verse en “Todo” y aquí te van a aparecer como “(sin tipo)” hasta que les pongas otro.</div>`));
  STATE.cats.forEach((c,i)=>{
    if(!c.label) c.label={es:"",en:""};
    const card=elFrom(`<div class="card">
      <div class="itemhead"><b>Tipo ${i+1}</b><div style="display:flex;gap:6px">
        <button class="btn ghost sm" data-act="up">↑</button>
        <button class="btn ghost sm" data-act="down">↓</button>
        <button class="btn danger sm" data-act="del">Eliminar</button></div></div>
      <div class="two">
        <div class="field"><label>Nombre (ES)</label><input data-l="es"></div>
        <div class="field"><label>Nombre (EN)</label><input data-l="en"></div>
      </div>
    </div>`);
    card.querySelector('[data-l="es"]').value=c.label.es||"";
    card.querySelector('[data-l="en"]').value=c.label.en||"";
    card.querySelector('[data-l="es"]').oninput=e=>{ c.label.es=e.target.value; };
    card.querySelector('[data-l="en"]').oninput=e=>{ c.label.en=e.target.value; };
    card.querySelector('[data-act="del"]').onclick=()=>{ if(confirm("¿Eliminar este tipo? Las piezas que lo usan quedarán como “(sin tipo)” hasta que les asignes otro.")){ STATE.cats.splice(i,1); renderPanel(); } };
    card.querySelector('[data-act="up"]').onclick=()=>{ if(i>0){ const t=STATE.cats[i-1]; STATE.cats[i-1]=STATE.cats[i]; STATE.cats[i]=t; renderPanel(); } };
    card.querySelector('[data-act="down"]').onclick=()=>{ if(i<STATE.cats.length-1){ const t=STATE.cats[i+1]; STATE.cats[i+1]=STATE.cats[i]; STATE.cats[i]=t; renderPanel(); } };
    p.appendChild(card);
  });
  const add=elFrom(`<button class="btn ghost">+ Agregar tipo</button>`);
  add.onclick=()=>{ STATE.cats.push({key:"cat-"+Date.now(), label:{es:"",en:""}}); renderPanel(); };
  p.appendChild(add);
}

/* ---------- GALERÍA ---------- */
function pieceItem(pz){
  if(!pz.titulo)pz.titulo={es:"",en:""}; if(!pz.tecnica)pz.tecnica={es:"",en:""}; if(!pz.descripcion)pz.descripcion={es:"",en:""}; if(!Array.isArray(pz.imgs))pz.imgs=[];
  if(pz.id==null) pz.id="pz-"+Date.now()+"-"+Math.random().toString(36).slice(2,5);
  const open=openPiezas.has(pz.id);
  const firstImg=pz.imgs[0]||"";
  const thumbStyle=firstImg?`background-image:url('${firstImg}')`:`background:linear-gradient(145deg,#3a0d47,#d11a5e)`;
  const estado=pz.estado||"disponible";
  const estLbl={disponible:"Disp.",vendido:"Vendido",reservado:"Resv."}[estado]||"Disp.";
  const c=elFrom(`<div class="pitem ${open?'open':''}" data-pid="${pz.id}">
    <div class="phead">
      <div class="pth" style="${thumbStyle}"></div>
      <div class="pin"><b>${pz.titulo.es||"(sin título)"}</b><span>${pz.medida||""}${pz.precio?(" · $"+pz.precio):""}</span></div>
      <span class="tagmini ${estado}">${estLbl}</span>
      <button class="btn ghost sm" data-act="edit">${open?"Cerrar":"Editar"}</button>
      <button class="btn danger sm" data-act="del">✕</button>
    </div>
    <div class="pbody ${open?'':'collapsed'}">
      <div class="field"><label>Fotos</label><div class="thumbs"></div>
        <input type="file" accept="image/*" multiple data-act="img"></div>
      <div class="field"><label>Título</label><input data-f="titulo.es" placeholder="Nombre de la pieza"></div>
      <div class="row">
        <div class="field"><label>Precio (MXN)</label><input type="number" data-f="precio"></div>
        <div class="field"><label>Estado</label><select data-f="estado">
          <option value="disponible">Disponible</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option></select></div>
      </div>
      <div class="field"><label>Descripción</label><textarea data-f="descripcion.es" rows="2"></textarea></div>
      <details class="more-det"><summary>Más detalles (medida, técnica, inglés, categoría, video)</summary>
        <div class="field"><label>Categoría</label><select data-f="cat"></select></div>
        <div class="field"><label>Medida</label><input data-f="medida" placeholder="50×70 cm"></div>
        <div class="row">
          <div class="field"><label>Técnica (ES)</label><input data-f="tecnica.es"></div>
          <div class="field"><label>Técnica (EN)</label><input data-f="tecnica.en"></div>
        </div>
        <div class="field"><label>Título (EN)</label><input data-f="titulo.en"></div>
        <div class="field"><label>Descripción (EN)</label><textarea data-f="descripcion.en" rows="2"></textarea></div>
        <div class="field"><label>Video corto (opcional, mp4)</label><div class="thumbs" data-vthumb></div>
          <input type="file" accept="video/*" data-act="vid"></div>
      </details>
      <button class="btn qsave" data-act="qsave">💾 Guardar y agregar otra</button>
    </div>
  </div>`);
  const idx=()=>STATE.piezas.indexOf(pz);
  const set=(sel,val)=>{const e=c.querySelector(sel); if(e)e.value=val;};
  const catSel=c.querySelector('[data-f="cat"]');
  catSel.innerHTML=(STATE.cats||[]).map(x=>`<option value="${x.key}">${(x.label&&x.label.es)||x.key}</option>`).join("");
  if(pz.cat && !(STATE.cats||[]).find(x=>x.key===pz.cat)) catSel.insertAdjacentHTML("beforeend",`<option value="${pz.cat}">${pz.cat} (sin tipo)</option>`);
  set('[data-f="titulo.es"]',pz.titulo.es||""); set('[data-f="titulo.en"]',pz.titulo.en||"");
  set('[data-f="descripcion.es"]',pz.descripcion.es||""); set('[data-f="descripcion.en"]',pz.descripcion.en||"");
  set('[data-f="precio"]',pz.precio??""); set('[data-f="medida"]',pz.medida||"");
  set('[data-f="cat"]',pz.cat||((STATE.cats[0]&&STATE.cats[0].key)||"")); set('[data-f="estado"]',estado);
  set('[data-f="tecnica.es"]',pz.tecnica.es||""); set('[data-f="tecnica.en"]',pz.tecnica.en||"");
  c.querySelectorAll("[data-f]").forEach(inp=>{ const h=e=>{
    const f=e.target.dataset.f, v=e.target.value;
    if(f==="precio") pz.precio=Number(v)||0;
    else if(f.indexOf(".")>0){const[a,b]=f.split(".");pz[a][b]=v;}
    else pz[f]=v;
  }; inp.oninput=h; inp.onchange=h; });
  const tw=c.querySelector(".thumbs");
  pz.imgs.forEach((u,j)=>{const th=elFrom(`<div class="thumb" style="background-image:url('${u}')"><button>×</button></div>`);
    th.querySelector("button").onclick=()=>{pz.imgs.splice(j,1);renderPanel();};tw.appendChild(th);});
  const vt=c.querySelector("[data-vthumb]");
  if(pz.video){const th=elFrom(`<div class="thumb" style="background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff">VIDEO<button>×</button></div>`);th.querySelector("button").onclick=()=>{pz.video="";renderPanel();};vt.appendChild(th);}
  c.querySelector('[data-act="edit"]').onclick=()=>{ if(openPiezas.has(pz.id))openPiezas.delete(pz.id); else openPiezas.add(pz.id); renderPanel(); };
  c.querySelector('[data-act="del"]').onclick=()=>{ if(confirm("¿Eliminar esta pieza?")){const k=idx(); if(k>-1)STATE.piezas.splice(k,1); openPiezas.delete(pz.id); renderPanel();} };
  c.querySelector('[data-act="img"]').onchange=async e=>{
    const files=[...e.target.files]; if(!files.length)return;
    toast("Subiendo foto(s)…");
    try{ for(const f of files){ pz.imgs.push(await uploadFile(f)); } renderPanel(); toast("Foto(s) subida(s)","ok"); }
    catch(err){ toast("Error al subir","bad"); }
  };
  c.querySelector('[data-act="vid"]').onchange=async e=>{
    const f=e.target.files[0]; if(!f)return; toast("Subiendo video…");
    try{ pz.video=await uploadFile(f); renderPanel(); toast("Video subido","ok"); }
    catch(err){ toast("Error al subir","bad"); }
  };
  const qbtn=c.querySelector('[data-act="qsave"]');
  qbtn.onclick=async ()=>{
    qbtn.disabled=true; qbtn.textContent="Guardando…";
    const ok=await save();
    if(!ok){ qbtn.disabled=false; qbtn.textContent="💾 Guardar y agregar otra"; return; }
    const cat=pz.cat||((STATE.cats[0]&&STATE.cats[0].key)||"");
    const id="pz-"+Date.now();
    STATE.piezas.push({id,cat,titulo:{es:"",en:""},descripcion:{es:"",en:""},precio:0,medida:"",estado:"disponible",tecnica:{es:"",en:""},imgs:[],video:""});
    openPiezas.clear(); openPiezas.add(id);
    renderPanel();
    setTimeout(()=>{const el=document.querySelector(`[data-pid="${id}"]`); if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},60);
  };
  return c;
}

function renderPiezas(p){
  p.appendChild(elFrom(`<div class="note">📷 Las piezas están <b>agrupadas por tipo</b>. Para agregar rápido: pícale a <b>“+ Agregar en …”</b>, sube la <b>foto</b>, pon <b>título</b> y <b>precio</b>, y listo. Lo demás (medida, técnica, inglés) es opcional en “Más detalles”. Si dejas el inglés vacío, al Guardar se copia el español.</div>`));
  const cats=STATE.cats||[];
  if(!cats.length){ p.appendChild(elFrom(`<div class="note">Primero crea al menos un <b>tipo de arte</b> en la pestaña “Tipos de arte”.</div>`)); return; }
  const known=new Set(cats.map(c=>c.key));
  const groups=cats.map(c=>({key:c.key,label:(c.label&&c.label.es)||c.key}));
  if(STATE.piezas.some(pz=>!known.has(pz.cat))) groups.push({key:null,label:"Sin categoría"});
  groups.forEach(g=>{
    const list=STATE.piezas.filter(pz=> g.key===null ? !known.has(pz.cat) : pz.cat===g.key);
    const sec=elFrom(`<div class="catgroup"><div class="catgrouphead"><h3>${g.label} <span class="cnt">${list.length}</span></h3></div></div>`);
    list.forEach(pz=> sec.appendChild(pieceItem(pz)));
    if(g.key!==null){
      const add=elFrom(`<button class="btn ghost sm addincat">+ Agregar en ${g.label}</button>`);
      add.onclick=()=>{ const id="pz-"+Date.now(); STATE.piezas.push({id,cat:g.key,titulo:{es:"",en:""},descripcion:{es:"",en:""},precio:0,medida:"",estado:"disponible",tecnica:{es:"",en:""},imgs:[],video:""}); openPiezas.add(id); renderPanel(); setTimeout(()=>{const el=document.querySelector(`[data-pid="${id}"]`); if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},60); };
      sec.appendChild(add);
    }
    p.appendChild(sec);
  });
}

/* ---------- ON THE STREETS ---------- */
function renderCalle(p){
  p.appendChild(elFrom(`<div class="note">📸 Fotos que mandan los clientes. El <b>pie de foto</b> lo escribes tú (ej. @usuario o el nombre de la pieza).</div>`));
  STATE.calle.forEach((c,i)=>{
    const card=elFrom(`<div class="card">
      <div class="itemhead"><b>Foto ${i+1}</b><button class="btn danger sm" data-act="del">Eliminar</button></div>
      <div class="thumbs"></div>
      <div class="field"><input type="file" accept="image/*" data-act="img"></div>
      <div class="field"><label>Pie de foto</label><input data-f="caption" placeholder="@cliente · Pantera"></div>
    </div>`);
    const cap=card.querySelector('[data-f="caption"]'); cap.value=c.caption||"";
    cap.oninput=e=>c.caption=e.target.value;
    const tw=card.querySelector(".thumbs");
    if(c.img){const th=elFrom(`<div class="thumb" style="background-image:url('${c.img}')"><button>×</button></div>`);
      th.querySelector("button").onclick=()=>{c.img="";renderPanel();};tw.appendChild(th);}
    card.querySelector('[data-act="del"]').onclick=()=>{STATE.calle.splice(i,1);renderPanel();};
    card.querySelector('[data-act="img"]').onchange=async e=>{
      const f=e.target.files[0]; if(!f)return; toast("Subiendo…");
      try{ c.img=await uploadFile(f); renderPanel(); toast("Lista","ok"); }catch(err){ toast("Error al subir","bad"); }
    };
    p.appendChild(card);
  });
  const add=elFrom(`<button class="btn ghost">+ Agregar foto</button>`);
  add.onclick=()=>{STATE.calle.push({img:"",caption:""});renderPanel();};
  p.appendChild(add);
}

/* ---------- BEHIND THE SCENES ---------- */
function renderProceso(p){
  p.appendChild(elFrom(`<div class="note">🎬 Piezas en proceso o clips cortos del taller. Sube una <b>foto</b> o un <b>video</b> (mp4). Marca su <b>estado</b> (disponible / reservado / vendido). En la página, el botón “Apartar” abre WhatsApp (se oculta si está vendido).</div>`));
  STATE.proceso.forEach((pr,i)=>{
    if(!pr.titulo)pr.titulo={es:"",en:""}; if(!pr.descripcion)pr.descripcion={es:"",en:""};
    const card=elFrom(`<div class="card">
      <div class="itemhead"><b>Item ${i+1}</b><button class="btn danger sm" data-act="del">Eliminar</button></div>
      <div class="row">
        <div class="field"><label>Título (ES)</label><input data-f="t.es"></div>
        <div class="field"><label>Título (EN)</label><input data-f="t.en"></div>
      </div>
      <div class="field"><label>Estado</label><select data-f="estado">
        <option value="disponible">Disponible</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option></select></div>
      <div class="two">
        <div class="field"><label>Descripción (ES)</label><textarea data-f="d.es" rows="2"></textarea></div>
        <div class="field"><label>Descripción (EN)</label><textarea data-f="d.en" rows="2"></textarea></div>
      </div>
      <div class="thumbs"></div>
      <div class="two">
        <div class="field"><label>Foto</label><input type="file" accept="image/*" data-act="img"></div>
        <div class="field"><label>Video (mp4)</label><input type="file" accept="video/*" data-act="vid"></div>
      </div>
    </div>`);
    const setv=(sel,val)=>{const e=card.querySelector(sel); if(e)e.value=val;};
    setv('[data-f="t.es"]',pr.titulo.es||""); setv('[data-f="t.en"]',pr.titulo.en||"");
    setv('[data-f="d.es"]',pr.descripcion.es||""); setv('[data-f="d.en"]',pr.descripcion.en||"");
    setv('[data-f="estado"]',pr.estado||"disponible");
    card.querySelector('[data-f="t.es"]').oninput=e=>pr.titulo.es=e.target.value;
    card.querySelector('[data-f="t.en"]').oninput=e=>pr.titulo.en=e.target.value;
    card.querySelector('[data-f="d.es"]').oninput=e=>pr.descripcion.es=e.target.value;
    card.querySelector('[data-f="d.en"]').oninput=e=>pr.descripcion.en=e.target.value;
    card.querySelector('[data-f="estado"]').onchange=e=>pr.estado=e.target.value;
    const tw=card.querySelector(".thumbs");
    if(pr.img){const th=elFrom(`<div class="thumb" style="background-image:url('${pr.img}')"><button>×</button></div>`);th.querySelector("button").onclick=()=>{pr.img="";renderPanel();};tw.appendChild(th);}
    if(pr.video){const th=elFrom(`<div class="thumb" style="background:#222;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff">VIDEO<button>×</button></div>`);th.querySelector("button").onclick=()=>{pr.video="";renderPanel();};tw.appendChild(th);}
    card.querySelector('[data-act="del"]').onclick=()=>{ if(confirm("¿Eliminar este item?")){STATE.proceso.splice(i,1);renderPanel();} };
    card.querySelector('[data-act="img"]').onchange=async e=>{const f=e.target.files[0];if(!f)return;toast("Subiendo…");try{pr.img=await uploadFile(f);pr.video="";renderPanel();toast("Lista","ok");}catch(err){toast("Error al subir","bad");}};
    card.querySelector('[data-act="vid"]').onchange=async e=>{const f=e.target.files[0];if(!f)return;toast("Subiendo video…");try{pr.video=await uploadFile(f);pr.img="";renderPanel();toast("Listo","ok");}catch(err){toast("Error al subir","bad");}};
    p.appendChild(card);
  });
  const add=elFrom(`<button class="btn ghost">+ Agregar item</button>`);
  add.onclick=()=>{STATE.proceso.push({titulo:{es:"",en:""},descripcion:{es:"",en:""},estado:"disponible",img:"",video:""});renderPanel();};
  p.appendChild(add);
}

/* ---------- FONDOS ---------- */
function renderFondo(p){
  const f=STATE.fondo; if(!Array.isArray(f.grad_colors))f.grad_colors=clone(DEF.fondo.grad_colors);
  p.appendChild(elFrom(`<div class="note">🎨 Los <b>5 colores</b> van de izquierda a derecha, como se ven en la portada. “Mostrar la reja” prende/apaga la malla encima del degradado. Abajo cambias el color de fondo del resto de la página.</div>`));
  const c=elFrom(`<div class="card">
    <h3>Degradado del inicio (hero)</h3><div class="hint">Los 5 colores de izquierda a derecha.</div>
    <div class="colors" id="grad"></div><div class="swatch" id="sw"></div>
    <div class="field" style="margin-top:14px"><label><input type="checkbox" id="fence" style="width:auto;margin-right:8px">Mostrar la reja encima del degradado</label></div>
  </div>
  <div class="card">
    <h3>Fondo del resto de la página</h3>
    <div class="two">
      <div class="field"><label>Color de fondo</label><input type="color" id="bodybg" style="height:40px"></div>
      <div class="field"><label>Textura</label><select id="wall">
        <option value="letras">Tag repetido (firma)</option><option value="solido">Sólido (sin textura)</option></select></div>
    </div>
  </div>`);
  const gc=c.querySelector("#grad"), sw=c.querySelector("#sw");
  const paint=()=>{ sw.style.background="linear-gradient(90deg,"+f.grad_colors.join(",")+")"; };
  f.grad_colors.forEach((col,idx)=>{const ci=elFrom(`<input type="color" value="${col}">`);ci.oninput=e=>{f.grad_colors[idx]=e.target.value;paint();};gc.appendChild(ci);});
  paint();
  const fence=c.querySelector("#fence"); fence.checked=f.fence_on!==false; fence.onchange=e=>f.fence_on=e.target.checked;
  const bb=c.querySelector("#bodybg"); bb.value=f.body_bg||"#0c0709"; bb.oninput=e=>f.body_bg=e.target.value;
  const wall=c.querySelector("#wall"); wall.value=f.wall_mode||"letras"; wall.onchange=e=>f.wall_mode=e.target.value;
  p.appendChild(c);
}

/* ---------- SAVE ---------- */
async function save(){
  if(!STATE)return;
  // si falta inglés, copia el español para no dejar vacío
  Object.keys(STATE.textos).forEach(k=>{const t=STATE.textos[k]; if(t && !t.en && t.es) t.en=t.es;});
  const cpES=(o)=>{ if(!o)return; ["titulo","tecnica","descripcion"].forEach(k=>{ if(o[k] && !o[k].en && o[k].es) o[k].en=o[k].es; }); };
  (STATE.piezas||[]).forEach(cpES);
  (STATE.proceso||[]).forEach(cpES);
  $("#saveBtn").disabled=true; $("#saveHint").textContent="Guardando…";
  const { error }=await sb.from("site").upsert({id:1,data:STATE,updated_at:new Date().toISOString()});
  $("#saveBtn").disabled=false; $("#saveHint").textContent="No olvides Guardar al terminar";
  if(error){ toast("No se pudo guardar: "+error.message,"bad"); return false; }
  else { toast("¡Guardado! Ya se ve en la página.","ok"); openPiezas.clear(); if(TAB==="piezas") renderPanel(); return true; }
}

/* ---------- WIRE ---------- */
$("#loginBtn").onclick=login;
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
$("#logoutBtn").onclick=logout;
$("#saveBtn").onclick=save;
tryRestore();
</script>
